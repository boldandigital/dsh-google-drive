name: publish

# A release is a tag. The workflow publishes the version in package.json to
# npm with OIDC, so no long-lived token is stored anywhere.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: The tag has to match the version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "the tag is $tag but package.json says $version"
            exit 1
          fi
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-google-drive@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$version is already on npm"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.published != 'true'
        run: |
          npm publish || {
            # The registry can refuse a publish that a local one just made,
            # or that another publisher made a moment earlier. If the version
            # is there, the release happened — that is what matters.
            version="$(node -p "require('./package.json').version")"
            if npm view "dsh-google-drive@$version" version >/dev/null 2>&1; then
              echo "$version is on npm; nothing left to do"
              exit 0
            fi
            exit 1
          }
